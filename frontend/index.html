<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Scheduler</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container main-container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="glass-card form-container">
                    <h2 class="text-center mb-4 title-gradient">Book a Meeting</h2>
                    <form id="meetingForm">
                        <input type="hidden" id="meetingId">
                        
                        <div class="mb-3">
                            <label for="username" class="form-label text-light">Full Name</label>
                            <input type="text" class="form-control glass-input" id="username" placeholder="John Doe" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label text-light">Email Address</label>
                            <input type="email" class="form-control glass-input" id="email" placeholder="john@example.com" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="time" class="form-label text-light">Select Time</label>
                            <select class="form-select glass-input" id="time" required>
                                <option value="" disabled selected>Choose a time slot</option>
                                <option value="10:00 AM">10:00 AM</option>
                                <option value="11:00 AM">11:00 AM</option>
                                <option value="01:00 PM">01:00 PM</option>
                                <option value="02:00 PM">02:00 PM</option>
                                <option value="03:00 PM">03:00 PM</option>
                            </select>
                            <small class="text-warning mt-1 d-block" id="slotInfo">Each time has 3 slots max.</small>
                        </div>
                        
                        <button type="submit" class="btn btn-gradient w-100" id="submitBtn">Schedule Meeting</button>
                    </form>
                    <div id="messageBox" class="mt-3 text-center"></div>
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-12">
                <h3 class="text-center mb-4 title-gradient">Scheduled Meetings</h3>
                <div class="row" id="meetingsList">
                    <!-- Meeting cards will be injected here via DOM manipulation -->
                </div>
            </div>
        </div>
    </div>

    <!-- Axios for HTTP requests -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
